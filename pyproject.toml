[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blackice"
dynamic = ["version"]        # single-sourced from blackice.__version__
description = "HITL adversarial review panel: a bounded loop of adversarial reviewer agents with a ruin-class circuit-breaker."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Agilit Ltd" }]
keywords = ["code-review", "adversarial", "agents", "claude-code", "llm"]
dependencies = []  # stdlib only

[project.optional-dependencies]
# Only needed if a target repo defines its panel in panel.yaml (panel.md needs nothing).
yaml = ["pyyaml>=6.0"]
# Test suite (stdlib-only core stays dependency-free; tests are opt-in).
test = ["pytest>=8.0"]

[project.scripts]
blackice = "blackice.cli:main"

[tool.setuptools.dynamic]
# One source of truth for the version: the package. Read statically, no import.
version = { attr = "blackice.__version__" }

[tool.setuptools.packages.find]
include = ["blackice*"]

[tool.pytest.ini_options]
# Tests live in tests/ and mirror the package; the ``blackice`` package sits at
# the repo root, so put the root on sys.path for imports — rootdir insertion no
# longer covers it once tests are nested.
testpaths = ["tests"]
pythonpath = ["."]
