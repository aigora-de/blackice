#
# Build, verify and publish kuang on a version tag.
#
# Three jobs, in order, and the order is the point: a tag publishes whatever is
# on it, so nothing is uploaded until the suite has run against it and the
# packaged version has been checked against the tag itself.
#
#   build     tests, builds, checks — no credentials, no publish rights
#   testpypi  automatic on any v* tag; this is where a release is validated
#   pypi      gated on a human approving the "pypi" environment
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in this
# repository, and no secret exists to leak or rotate. The two publish jobs are
# the only ones granted `id-token: write`, and they hold no other permission.
#
# Actions are pinned to commit SHAs rather than tags. A mutable tag on a
# third-party action is a supply-chain path straight to a job holding an OIDC
# token that can publish under our name. The comment beside each SHA records the
# release it came from, since a SHA alone says nothing about how stale it is.
#
# All four GitHub-authored actions run on Node 24; Node 20 is deprecated on the
# runners. `pypa/gh-action-pypi-publish` is a composite action and has no Node
# runtime of its own.
#
# SETUP REQUIRED BEFORE THE FIRST RUN — see RELEASING.md. The trusted publishers
# on TestPyPI and PyPI, and the two GitHub environments, must exist first; the
# "pypi" environment's required reviewers are the release gate.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: test, build, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"     # the lowest we claim to support

      - name: Install the package and its test extra
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'

      - name: Run the suite against the packaged layout
        run: python -m pytest -q

      - name: Confirm the installed console script and module entry point work
        run: |
          kuang --help > /dev/null
          python -m kuang --help > /dev/null

      - name: Build the sdist and wheel
        run: python -m pip install build && python -m build

      - name: Check the metadata renders
        run: python -m pip install twine && python -m twine check dist/*

      - name: Refuse a tag that disagrees with the packaged version
        # A v0.2.0 tag that ships 0.1.0 is a release that lies about what it is,
        # and PyPI will not let it be corrected — a version can be yanked, never
        # replaced. Cheaper to fail here.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(python -c "import kuang; print(kuang.__version__)")
          echo "tag=$tag packaged=$built"
          test "$tag" = "$built" || {
            echo "::error::tag $GITHUB_REF_NAME does not match kuang.__version__ ($built)"
            exit 1
          }

      - name: Confirm the wheel ships only the kuang namespace
        # The hazard this project packages around: an unrelated PyPI project owns
        # the import name `blackice`. Shipping any second top-level name would
        # re-open exactly the collision the rename closed.
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          tops = {n.split("/")[0] for n in zipfile.ZipFile(wheel).namelist()}
          tops -= {n for n in tops if n.endswith(".dist-info")}
          print("top-level:", sorted(tops))
          if tops != {"kuang"}:
              sys.exit(f"wheel ships more than the kuang package: {sorted(tops)}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/kuang
    permissions:
      id-token: write             # OIDC only; nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run of the same tag should not fail the job on an already-uploaded
          # file; TestPyPI is where we iterate.
          skip-existing: true

  pypi:
    name: publish to PyPI
    needs: testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # THE GATE. The "pypi" environment carries required reviewers, so this job
    # waits for a human before it can run. Publishing is irreversible — a version
    # can be yanked but never re-uploaded — and this project does not let a tool
    # decide anything that matters. Per ROADMAP.md the first real publish is
    # v0.3.0, at the close of Epoch 2; until then this job is approved by nobody.
    environment:
      name: pypi
      url: https://pypi.org/p/kuang
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
